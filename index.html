<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mermaid Editor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a23;
      --surface2: #22222e;
      --border: #2a2a3a;
      --text: #e0e0e8;
      --text-dim: #8888a0;
      --accent: #7c6bf0;
      --accent-hover: #8d7ef5;
      --danger: #f06b6b;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 .icon {
      width: 22px;
      height: 22px;
      background: var(--accent);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .privacy-link {
      font-size: 12px;
      color: var(--text-dim);
      text-decoration: none;
      margin-right: 4px;
    }
    .privacy-link:hover { color: var(--text); }

    .btn {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { background: var(--border); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }

    /* Download dropdown */
    .dropdown {
      position: relative;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      min-width: 180px;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .dropdown-menu.open { display: block; }

    .dropdown-item {
      display: block;
      width: 100%;
      padding: 8px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: none;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-align: left;
    }

    .dropdown-item:hover { background: var(--border); }

    .dropdown-item span {
      color: var(--text-dim);
      font-size: 11px;
      margin-left: 4px;
    }

    /* Main layout */
    main {
      display: grid;
      grid-template-columns: 1fr 1.6fr 270px;
      flex: 1;
      overflow: hidden;
    }

    /* Editor pane */
    .editor-pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .pane-header {
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #editor {
      flex: 1;
      width: 100%;
      resize: none;
      background: var(--bg);
      color: var(--text);
      border: none;
      outline: none;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      tab-size: 2;
    }

    /* Preview pane */
    .preview-pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .preview-pane .pane-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-right: 8px;
    }

    .preview-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .error-indicator {
      color: var(--danger);
      font-size: 11px;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
      display: none;
    }

    .error-indicator.visible { display: inline; }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      text-transform: none;
      letter-spacing: 0;
    }

    .zoom-btn {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      width: 26px;
      height: 26px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.15s;
    }

    .zoom-btn:hover { background: var(--border); }

    .zoom-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text);
      min-width: 42px;
      text-align: center;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .zoom-label:hover { background: var(--surface2); }

    #preview-container {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: safe center;
      justify-content: safe center;
      padding: 24px;
      background: #ffffff;
      transition: background-color 0.2s;
    }

    #preview {
      max-width: 100%;
    }

    #preview svg {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    /* Customization panel */
    .customize-pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .controls {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    .control-section {
      margin-bottom: 20px;
    }

    .control-section h3 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 5px;
      color: var(--text);
    }

    .control-group select,
    .control-group input[type="range"] {
      width: 100%;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
    }

    .control-group select {
      padding: 6px 10px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }

    .control-group select:focus { border-color: var(--accent); }

    .control-group input[type="range"] {
      -webkit-appearance: none;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      margin-top: 4px;
    }

    .control-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    .range-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .range-value {
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-input-wrapper {
      position: relative;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .color-input-wrapper input[type="color"] {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      background: none;
      -webkit-appearance: none;
    }

    .color-input-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 2px;
    }

    .color-input-wrapper input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 4px;
    }

    .color-hex {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

    /* Responsive */
    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 200px 1fr auto;
      }
      .editor-pane, .preview-pane { border-right: none; border-bottom: 1px solid var(--border); }
      .customize-pane { max-height: 250px; }
    }
  </style>
</head>
<body>
  <header>
    <h1><span class="icon">◇</span> Mermaid Editor</h1>
    <div class="header-actions">
      <a class="privacy-link" href="/privacy.html">Privacy</a>
      <button class="btn" id="btn-reset">Reset Theme</button>
      <div class="dropdown">
        <button class="btn btn-primary" id="btn-download">↓ Download</button>
        <div class="dropdown-menu" id="download-menu">
          <button class="dropdown-item" data-format="svg">SVG <span>vector</span></button>
          <button class="dropdown-item" data-format="png-1x">PNG <span>1x</span></button>
          <button class="dropdown-item" data-format="png-2x">PNG <span>2x</span></button>
          <button class="dropdown-item" data-format="png-4x">PNG <span>4x</span></button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="editor-pane">
      <div class="pane-header">Markup</div>
      <textarea id="editor" spellcheck="false">graph TD
    A[Start] -->|Begin| B{Decision}
    B -->|Yes| C[Process A]
    B -->|No| D[Process B]
    C --> E[Result 1]
    D --> F[Result 2]
    E --> G[End]
    F --> G</textarea>
    </div>

    <div class="preview-pane">
      <div class="pane-header">
        <div class="preview-header-left">
          <span>Preview</span>
          <span class="error-indicator" id="error-indicator">⚠ Syntax error</span>
        </div>
        <div class="zoom-controls">
          <button class="zoom-btn" id="zoom-out" title="Zoom out (Ctrl/⌘ -)">−</button>
          <span class="zoom-label" id="zoom-label" title="Reset to 100%">100%</span>
          <button class="zoom-btn" id="zoom-in" title="Zoom in (Ctrl/⌘ +)">+</button>
        </div>
      </div>
      <div id="preview-container">
        <div id="preview"></div>
      </div>
    </div>

    <div class="customize-pane">
      <div class="pane-header">Customize</div>
      <div class="controls">
        <div class="control-section">
          <h3>Theme</h3>
          <div class="control-group">
            <label>Theme Preset</label>
            <select id="ctrl-theme">
              <option value="amethyst" selected>Amethyst</option>
              <option value="ocean">Ocean</option>
              <option value="sunset">Sunset</option>
              <option value="mint">Mint</option>
              <option value="charcoal">Charcoal</option>
              <option value="rose">Rose</option>
              <option value="amber">Amber</option>
              <option value="arctic">Arctic</option>
              <option value="terra">Terra</option>
              <option value="neon">Neon</option>
            </select>
          </div>
        </div>

        <div class="control-section">
          <h3>Colors</h3>
          <div class="control-group">
            <label>Node Fill</label>
            <div class="color-row">
              <div class="color-input-wrapper">
                <input type="color" id="ctrl-node-fill" value="#7c6bf0">
              </div>
              <span class="color-hex" data-for="ctrl-node-fill">#7c6bf0</span>
            </div>
          </div>
          <div class="control-group">
            <label>Node Border</label>
            <div class="color-row">
              <div class="color-input-wrapper">
                <input type="color" id="ctrl-node-border" value="#5a4fc7">
              </div>
              <span class="color-hex" data-for="ctrl-node-border">#5a4fc7</span>
            </div>
          </div>
          <div class="control-group">
            <label>Line / Edge</label>
            <div class="color-row">
              <div class="color-input-wrapper">
                <input type="color" id="ctrl-line-color" value="#6e6e8a">
              </div>
              <span class="color-hex" data-for="ctrl-line-color">#6e6e8a</span>
            </div>
          </div>
          <div class="control-group">
            <label>Text Color</label>
            <div class="color-row">
              <div class="color-input-wrapper">
                <input type="color" id="ctrl-text-color" value="#1a1a2e">
              </div>
              <span class="color-hex" data-for="ctrl-text-color">#1a1a2e</span>
            </div>
          </div>
          <div class="control-group">
            <label>Edge Label</label>
            <div class="color-row">
              <div class="color-input-wrapper">
                <input type="color" id="ctrl-edge-text" value="#1a1a2e">
              </div>
              <span class="color-hex" data-for="ctrl-edge-text">#1a1a2e</span>
            </div>
          </div>
          <div class="control-group">
            <label>Background</label>
            <div class="color-row">
              <div class="color-input-wrapper">
                <input type="color" id="ctrl-bg-color" value="#ffffff">
              </div>
              <span class="color-hex" data-for="ctrl-bg-color">#ffffff</span>
            </div>
          </div>
        </div>

        <div class="control-section">
          <h3>Typography</h3>
          <div class="control-group">
            <div class="range-label">
              <label>Font Size</label>
              <span class="range-value" id="font-size-value">14px</span>
            </div>
            <input type="range" id="ctrl-font-size" min="10" max="24" value="14">
          </div>
          <div class="control-group">
            <label>Font Family</label>
            <select id="ctrl-font-family">
              <option value="Inter, sans-serif">Inter</option>
              <option value="Arial, sans-serif">Arial</option>
              <option value="Georgia, serif">Georgia</option>
              <option value="'Courier New', monospace">Monospace</option>
              <option value="'Trebuchet MS', sans-serif" selected>Trebuchet MS</option>
              <option value="Verdana, sans-serif">Verdana</option>
            </select>
          </div>
        </div>

        <div class="control-section">
          <h3>Layout</h3>
          <div class="control-group">
            <div class="range-label">
              <label>Curve Style</label>
            </div>
            <select id="ctrl-curve">
              <option value="basis" selected>Curved</option>
              <option value="linear">Straight</option>
              <option value="stepBefore">Step</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    // State
    let renderCounter = 0;
    let debounceTimer = null;
    let lastValidSvg = '';

    // DOM refs
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const previewContainer = document.getElementById('preview-container');
    const errorIndicator = document.getElementById('error-indicator');
    const downloadMenu = document.getElementById('download-menu');
    const zoomInBtn = document.getElementById('zoom-in');
    const zoomOutBtn = document.getElementById('zoom-out');
    const zoomLabel = document.getElementById('zoom-label');

    // Controls
    const ctrlTheme = document.getElementById('ctrl-theme');
    const ctrlNodeFill = document.getElementById('ctrl-node-fill');
    const ctrlNodeBorder = document.getElementById('ctrl-node-border');
    const ctrlLineColor = document.getElementById('ctrl-line-color');
    const ctrlTextColor = document.getElementById('ctrl-text-color');
    const ctrlEdgeText = document.getElementById('ctrl-edge-text');
    const ctrlBgColor = document.getElementById('ctrl-bg-color');
    const ctrlFontSize = document.getElementById('ctrl-font-size');
    const ctrlFontFamily = document.getElementById('ctrl-font-family');
    const ctrlCurve = document.getElementById('ctrl-curve');
    const fontSizeValue = document.getElementById('font-size-value');

    // Custom theme presets
    const themes = {
      amethyst:  { nodeFill: '#7c6bf0', nodeBorder: '#5a4fc7', line: '#6e6e8a', text: '#1a1a2e', edgeText: '#1a1a2e', bg: '#ffffff' },
      ocean:     { nodeFill: '#2196f3', nodeBorder: '#1565c0', line: '#4a8db7', text: '#0d2137', edgeText: '#0d2137', bg: '#e8f4fd' },
      sunset:    { nodeFill: '#ff6b35', nodeBorder: '#d4451a', line: '#c97a5a', text: '#2d1810', edgeText: '#2d1810', bg: '#fff5f0' },
      mint:      { nodeFill: '#26a69a', nodeBorder: '#00796b', line: '#5d9e97', text: '#0a2e2a', edgeText: '#0a2e2a', bg: '#e0f2f1' },
      charcoal:  { nodeFill: '#546e7a', nodeBorder: '#37474f', line: '#78909c', text: '#eceff1', edgeText: '#cfd8dc', bg: '#263238' },
      rose:      { nodeFill: '#e91e63', nodeBorder: '#ad1457', line: '#c2768e', text: '#2a0a15', edgeText: '#2a0a15', bg: '#fce4ec' },
      amber:     { nodeFill: '#ffb300', nodeBorder: '#e68a00', line: '#bfa463', text: '#2e2200', edgeText: '#2e2200', bg: '#fff8e1' },
      arctic:    { nodeFill: '#b0bec5', nodeBorder: '#78909c', line: '#90a4ae', text: '#1c313a', edgeText: '#1c313a', bg: '#eceff1' },
      terra:     { nodeFill: '#8d6e63', nodeBorder: '#5d4037', line: '#a1887f', text: '#1b0f0a', edgeText: '#1b0f0a', bg: '#efebe9' },
      neon:      { nodeFill: '#00e676', nodeBorder: '#00c853', line: '#69f0ae', text: '#121212', edgeText: '#e0e0e0', bg: '#121212' },
    };

    function applyThemeToControls(name) {
      const t = themes[name];
      if (!t) return;
      ctrlNodeFill.value = t.nodeFill;
      ctrlNodeBorder.value = t.nodeBorder;
      ctrlLineColor.value = t.line;
      ctrlTextColor.value = t.text;
      ctrlEdgeText.value = t.edgeText;
      ctrlBgColor.value = t.bg;
      [ctrlNodeFill, ctrlNodeBorder, ctrlLineColor, ctrlTextColor, ctrlEdgeText, ctrlBgColor].forEach(updateColorHex);
      updateBgColor();
    }

    function getThemeVariables() {
      return {
        primaryColor: ctrlNodeFill.value,
        primaryBorderColor: ctrlNodeBorder.value,
        primaryTextColor: ctrlTextColor.value,
        lineColor: ctrlLineColor.value,
        fontSize: ctrlFontSize.value + 'px',
        fontFamily: ctrlFontFamily.value,
        background: ctrlBgColor.value,
        mainBkg: ctrlNodeFill.value,
        nodeBorder: ctrlNodeBorder.value,
        nodeTextColor: ctrlTextColor.value,
        edgeLabelBackground: ctrlBgColor.value,
        clusterBkg: ctrlNodeFill.value + '22',
        clusterBorder: ctrlNodeBorder.value,
        titleColor: ctrlTextColor.value,
      };
    }

    function getConfig() {
      return {
        startOnLoad: false,
        theme: 'base',
        themeVariables: getThemeVariables(),
        flowchart: { curve: ctrlCurve.value, padding: 20 },
        securityLevel: 'loose',
      };
    }

    async function renderDiagram() {
      const code = editor.value.trim();
      if (!code) {
        preview.innerHTML = '<p style="color:#999;font-size:14px;">Enter Mermaid markup to see a preview</p>';
        return;
      }

      try {
        // Remove previous render
        const oldEl = document.getElementById(`mermaid-${renderCounter}`);
        if (oldEl) oldEl.remove();

        renderCounter++;
        const id = `mermaid-${renderCounter}`;

        mermaid.initialize(getConfig());
        const { svg } = await mermaid.render(id, code);
        preview.innerHTML = svg;
        // Apply edge label color via DOM since mermaid has no themeVariable for it
        preview.querySelectorAll('.edgeLabel').forEach(el => {
          el.style.color = ctrlEdgeText.value;
          el.querySelectorAll('span, p, text').forEach(t => t.style.color = ctrlEdgeText.value);
        });
        lastValidSvg = preview.innerHTML;
        errorIndicator.classList.remove('visible');
      } catch (err) {
        errorIndicator.classList.add('visible');
        errorIndicator.title = err.message || 'Parse error';
        // Keep last valid render
        if (lastValidSvg) {
          preview.innerHTML = lastValidSvg;
        }
        // Clean up mermaid error elements
        const errEl = document.getElementById(`dmermaid-${renderCounter}`);
        if (errEl) errEl.remove();
      }
    }

    function debouncedRender() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(renderDiagram, 300);
    }

    // Update hex display
    function updateColorHex(input) {
      const hex = document.querySelector(`.color-hex[data-for="${input.id}"]`);
      if (hex) hex.textContent = input.value;
    }

    // Background color applies to container
    function updateBgColor() {
      previewContainer.style.backgroundColor = ctrlBgColor.value;
    }

    // Event listeners
    editor.addEventListener('input', debouncedRender);

    // Tab key support in editor
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        debouncedRender();
      }
    });

    // Customization controls
    const colorInputs = [ctrlNodeFill, ctrlNodeBorder, ctrlLineColor, ctrlTextColor, ctrlEdgeText, ctrlBgColor];
    colorInputs.forEach(input => {
      input.addEventListener('input', () => {
        updateColorHex(input);
        if (input === ctrlBgColor) updateBgColor();

        renderDiagram();
      });
    });

    ctrlFontSize.addEventListener('input', () => {
      fontSizeValue.textContent = ctrlFontSize.value + 'px';
      ctrlTheme.value = 'base';
      renderDiagram();
    });

    ctrlFontFamily.addEventListener('change', () => {
      ctrlTheme.value = 'base';
      renderDiagram();
    });

    ctrlTheme.addEventListener('change', () => {
      applyThemeToControls(ctrlTheme.value);
      renderDiagram();
    });
    ctrlCurve.addEventListener('change', renderDiagram);

    // Reset theme
    document.getElementById('btn-reset').addEventListener('click', () => {
      ctrlTheme.value = 'amethyst';
      applyThemeToControls('amethyst');
      ctrlFontSize.value = '14';
      fontSizeValue.textContent = '14px';
      ctrlFontFamily.value = "'Trebuchet MS', sans-serif";
      ctrlCurve.value = 'basis';
      renderDiagram();
    });

    // Download dropdown
    document.getElementById('btn-download').addEventListener('click', (e) => {
      e.stopPropagation();
      downloadMenu.classList.toggle('open');
    });

    document.addEventListener('click', () => downloadMenu.classList.remove('open'));

    // Export functions
    const EXPORT_MARGIN = 24;

    // Build an export-ready SVG: tight viewBox around actual content + symmetric
    // margin on all sides so the diagram is visually centered regardless of any
    // asymmetric whitespace mermaid may leave in its own viewBox.
    function buildExportSvg() {
      const svgEl = preview.querySelector('svg');
      if (!svgEl) return null;
      const clone = svgEl.cloneNode(true);

      let content;
      try {
        content = svgEl.getBBox();
      } catch (e) {
        const r = svgEl.getBoundingClientRect();
        content = { x: 0, y: 0, width: r.width, height: r.height };
      }

      const m = EXPORT_MARGIN;
      const x = content.x - m;
      const y = content.y - m;
      const w = content.width + 2 * m;
      const h = content.height + 2 * m;
      clone.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
      clone.setAttribute('width', w);
      clone.setAttribute('height', h);

      const bg = ctrlBgColor.value;
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', x);
      rect.setAttribute('y', y);
      rect.setAttribute('width', w);
      rect.setAttribute('height', h);
      rect.setAttribute('fill', bg);
      clone.insertBefore(rect, clone.firstChild);

      return { svg: new XMLSerializer().serializeToString(clone), width: w, height: h };
    }

    function getFilenameBase() {
      // Extract first node label from the markup using common patterns: [label], (label), {label}
      const code = editor.value;
      const match = code.match(/[\[({]([^\])}]+)[\])}]/);
      const label = match ? match[1].trim() : 'mermaid-diagram';
      // Sanitize for filename: lowercase, replace spaces/special chars with hyphens
      return label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'mermaid-diagram';
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportSVG() {
      const result = buildExportSvg();
      if (!result) return;
      const blob = new Blob([result.svg], { type: 'image/svg+xml;charset=utf-8' });
      downloadBlob(blob, `${getFilenameBase()}.svg`);
    }

    function exportPNG(scale) {
      const result = buildExportSvg();
      if (!result) return;

      const width = result.width * scale;
      const height = result.height * scale;

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          downloadBlob(blob, `${getFilenameBase()}-${scale}x.png`);
        }, 'image/png');
      };
      img.onerror = () => {
        const b64 = btoa(unescape(encodeURIComponent(result.svg)));
        img.src = 'data:image/svg+xml;base64,' + b64;
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(result.svg);
    }

    // Download menu items
    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        const format = item.dataset.format;
        downloadMenu.classList.remove('open');
        if (format === 'svg') exportSVG();
        else if (format === 'png-1x') exportPNG(1);
        else if (format === 'png-2x') exportPNG(2);
        else if (format === 'png-4x') exportPNG(4);
      });
    });

    // Zoom controls
    const ZOOM_MIN = 0.25;
    const ZOOM_MAX = 4;
    const ZOOM_STEPS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3, 4];
    let zoomLevel = 1;

    function applyZoom() {
      preview.style.zoom = zoomLevel;
      zoomLabel.textContent = Math.round(zoomLevel * 100) + '%';
    }

    function setZoom(z) {
      zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
      applyZoom();
    }

    function zoomStep(dir) {
      if (dir > 0) {
        const next = ZOOM_STEPS.find(s => s > zoomLevel + 0.001);
        setZoom(next ?? ZOOM_MAX);
      } else {
        const prev = [...ZOOM_STEPS].reverse().find(s => s < zoomLevel - 0.001);
        setZoom(prev ?? ZOOM_MIN);
      }
    }

    zoomInBtn.addEventListener('click', () => zoomStep(1));
    zoomOutBtn.addEventListener('click', () => zoomStep(-1));
    zoomLabel.addEventListener('click', () => setZoom(1));

    // Ctrl/Cmd + wheel to zoom inside the preview
    previewContainer.addEventListener('wheel', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      e.preventDefault();
      zoomStep(e.deltaY < 0 ? 1 : -1);
    }, { passive: false });

    // Ctrl/Cmd +/- keyboard shortcuts (when preview pane is focused area)
    document.addEventListener('keydown', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      if (e.target === editor) return;
      if (e.key === '=' || e.key === '+') { e.preventDefault(); zoomStep(1); }
      else if (e.key === '-') { e.preventDefault(); zoomStep(-1); }
      else if (e.key === '0') { e.preventDefault(); setZoom(1); }
    });

    // Initial render
    renderDiagram();
  </script>
</body>
</html>
